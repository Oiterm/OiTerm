# v로 시작하는 태그(v2.0.0 등)를 올리면 Windows에서 빌드 → 업데이트 정보 서명 → GitHub 릴리즈에 올림
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 태그와 package.json 버전 확인
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then echo "태그($GITHUB_REF_NAME)와 package.json 버전(v$V)이 다릅니다"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: 의존성 설치
        run: npm ci

      - name: 보안 점검 (배포에 들어가는 패키지, high 이상이면 중단)
        run: npm audit --omit=dev --audit-level=high

      - name: 빌드 (설치 프로그램 + zip)
        run: npm run dist:release

      - name: 업데이트 정보 서명
        env:
          OITERM_UPDATE_KEY: ${{ secrets.OITERM_UPDATE_KEY }}
        run: node tools/make-update-manifest.js

      - name: GitHub 릴리즈 만들기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/OiTerm-Setup-$VERSION.exe" \
            "dist/OiTerm-$VERSION-win-x64.zip" \
            dist/latest.json dist/latest.json.sig \
            --repo "$GITHUB_REPOSITORY" \
            --title "OiTerm $VERSION" \
            --notes-file dist/RELEASE_NOTES.md
