# 릴리즈: Windows에서 빌드 → 업데이트 정보 서명 → GitHub 릴리즈에 올림
#  - 방법 1: Actions 탭 → release → "Run workflow" (package.json 버전으로 v<버전> 태그를 만들어 올림)
#  - 방법 2: v2.0.0 같은 태그를 올림
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # main 브랜치나 v 태그에서만 (다른 브랜치에서 실수로 릴리즈 방지)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 버전 확인
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then echo "태그($GITHUB_REF_NAME)와 package.json 버전(v$V)이 다릅니다"; exit 1; fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$V 릴리즈가 이미 있습니다. package.json 버전을 올리세요."; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: 의존성 설치
        run: npm ci

      - name: 보안 점검 (배포에 들어가는 패키지, high 이상이면 중단)
        run: npm audit --omit=dev --audit-level=high

      - name: 빌드 (설치 프로그램 + zip)
        run: npm run dist:release

      - name: 업데이트 정보 서명
        env:
          OITERM_UPDATE_KEY: ${{ secrets.OITERM_UPDATE_KEY }}
        run: node tools/make-update-manifest.js

      - name: GitHub 릴리즈 만들기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/OiTerm-Setup-$VERSION.exe" \
            "dist/OiTerm-$VERSION-win-x64.zip" \
            dist/latest.json dist/latest.json.sig \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OiTerm $VERSION" \
            --notes-file dist/RELEASE_NOTES.md
